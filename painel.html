<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel do Professor · JJR</title>
  <link rel="stylesheet" href="./css/main.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="topbar">
    <h1>✝ Painel do Professor</h1>
    <div class="actions">
      <span id="prof-name"></span>
      <button id="btn-logout">Sair</button>
    </div>
  </header>

  <div class="layout">
    <aside id="sidebar" class="sidebar">
      <button class="menu-item active" data-tab="dashboard">📊 Dashboard</button>
      <button class="menu-item" data-tab="alunos">👥 Alunos</button>
      <button class="menu-item" data-tab="ranking">🏅 Ranking</button>
      <button class="menu-item" data-tab="presenca">✅ Presença</button>
      <button class="menu-item" data-tab="relatorio">📄 Relatório</button>
      <button class="menu-item" data-tab="calendario">📅 Calendário</button>
      <button class="menu-item" data-tab="pontos">⭐ Pontuação</button>
      <button class="menu-item" data-tab="devocional">✝ Devocionais</button>
      <button class="menu-item" data-tab="campeonatos">🏆 Campeonatos</button>
      <button class="menu-item" data-tab="cestas">🥫 Cestas</button>
      <button class="menu-item" data-tab="recompensas">🎁 Recompensas</button>
      <button class="menu-item" data-tab="metas">🎯 Metas</button>
      <button class="menu-item" data-tab="inscricoes">📋 Inscrições</button>
      <button class="menu-item" data-tab="professores">👨‍🏫 Professores</button>
      <button class="menu-item" data-tab="configuracoes">⚙ Configurações</button>
    </aside>

    <main id="panel-sections" class="sections">
      <section id="sec-dashboard" class="tab-content active"></section>
      <section id="sec-alunos" class="tab-content"></section>
      <section id="sec-ranking" class="tab-content"></section>
      <section id="sec-presenca" class="tab-content"></section>
      <section id="sec-relatorio" class="tab-content"></section>
      <section id="sec-calendario" class="tab-content"></section>
      <section id="sec-pontos" class="tab-content"></section>
      <section id="sec-devocional" class="tab-content"></section>
      <section id="sec-campeonatos" class="tab-content"></section>
      <section id="sec-cestas" class="tab-content"></section>
      <section id="sec-recompensas" class="tab-content"></section>
      <section id="sec-metas" class="tab-content"></section>
      <section id="sec-inscricoes" class="tab-content"></section>
      <section id="sec-professores" class="tab-content"></section>
      <section id="sec-configuracoes" class="tab-content"></section>
    </main>
  </div>

  <div id="toast" class="toast"></div>
  <script type="module" src="./js/painel.js"></script>
</body>
</html>
